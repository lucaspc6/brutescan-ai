<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
      <div class="container">
        <h1 id="tituloLogin">Login</h1>

        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" required />

          <button type="submit">Entrar</button>
          <div id="mensagem" aria-live="polite"></div>
        </form>

        <section id="bemVindo" style="display: none;">
          <h2>Seja bem-vindo!</h2>
          <p>Você está logado com sucesso.</p>
          <button id="logoutBtn">Sair</button>
          <button id="criarUsuariosBtn" style="display: none;">Criar usuários aleatórios</button>
          <button id="simularLoginsBtn" style="display: none;">Simular logins</button>
        </section>
      </div>
  </body>
</html>
